<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter 2 Review Quiz 2</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:Canvas;color:CanvasText}main{max-width:720px;margin:auto;padding:1.25rem}h1{font-size:1.65rem;margin-bottom:.2rem}.muted{opacity:.78}.panel{border:1px solid color-mix(in srgb,CanvasText 25%,transparent);border-radius:14px;padding:1.1rem;margin-top:1rem}.choice{display:flex;gap:.75rem;align-items:center;border:1px solid color-mix(in srgb,CanvasText 25%,transparent);border-radius:10px;padding:.85rem;margin:.65rem 0;font-size:1.05rem}input{inline-size:1.25rem;block-size:1.25rem}button{font:inherit;padding:.75rem 1rem;border-radius:9px;border:1px solid CanvasText;background:ButtonFace;color:ButtonText;margin-top:.5rem}button.primary{background:#1769e0;color:#fff;border-color:#1769e0}button[hidden],#feedback[hidden],#done[hidden]{display:none}.correct{color:#178142}.wrong{color:#c63131}progress{inline-size:100%;block-size:.8rem}
  </style>
</head>
<body><main>
  <h1>Chapter 2: Review Quiz 2</h1><p><a href="../">← Return to quiz library</a></p><p class="muted">New questions only. Submit each answer to see the explanation.</p>
  <progress id="bar" value="0" max="14"></progress><p id="meta" class="muted" aria-live="polite"></p>
  <section id="quiz" class="panel"><p id="topic" class="muted"></p><h2 id="prompt"></h2><form id="form"><div id="choices"></div><p id="warning" class="wrong" hidden></p><button class="primary" id="submit" type="submit">Submit answer</button><button id="next" type="button" hidden>Next question</button></form><div id="feedback" aria-live="polite" hidden></div></section>
  <section id="done" class="panel" hidden><h2>Complete</h2><p id="score"></p><div id="focus"></div><button class="primary" id="restart" type="button">Start again</button></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<script>
const qs=[
['Random experiments','Which statement best describes a random experiment?',['Its result is exactly determined before it is run','It produces one of several possible outcomes unpredictably under repeated identical conditions','It always has equally likely outcomes','It cannot be modeled mathematically'],[1],'A random experiment has an unpredictable individual outcome, even when its conditions are repeated. A probability model describes the possible outcomes and their long-run behavior.'],
['Outcomes and events','A die is rolled and the event is “the result exceeds 4.” Which outcomes belong to this event?',['{1, 2, 3, 4}','{4, 5, 6}','{5, 6}','{6}'],[2],'An event is a subset of the sample space. The outcomes greater than 4 are \(\{5,6\}\).'],
['Elementary events','A standard deck is shuffled and one card is selected. Which is an elementary event?',['The card is red','The card is a face card','The card is the queen of hearts','The card is a heart or a spade'],[2],'An elementary event contains exactly one outcome. “Queen of hearts” identifies one particular card.'],
['Set operations','Let \(A=\{1,3,5\}\) and \(B=\{3,4,5\}\). What is \(A\cap B\)?',['{1, 3, 4, 5}','{3, 5}','{1, 4}','∅'],[1],'The intersection contains outcomes in both sets. Both \(3\) and \(5\) appear in \(A\) and \(B\).'],
['Complements','If \(P(A)=0.27\), what is \(P(A^c)\)?',['0.27','0.63','0.73','1.27'],[2],'An event and its complement account for every outcome: \(P(A^c)=1-P(A)=1-0.27=0.73\).'],
['Probability bounds','Which probability assignment is impossible?',['\(P(A)=0\)','\(P(A)=0.82\)','\(P(A)=1\)','\(P(A)=1.12\)'],[3],'Every probability must satisfy \(0\le P(A)\le1\). A value of \(1.12\) is outside that range.'],
['Counting methods','A password consists of one letter chosen from \(\{A,B,C\}\), followed by one digit chosen from \(\{0,1,2,3\}\). How many passwords are possible?',['7','12','16','24'],[1],'Use the multiplication principle: \(3\) choices for the letter times \(4\) choices for the digit gives \(3\times4=12\).'],
['Conditional probability','From a 52-card deck, a card is known to be a face card. What is the probability it is a heart?',['\(1/52\)','\(1/13\)','\(1/4\)','\(3/13\)'],[2],'Given “face card,” the possible cards are the 12 jacks, queens, and kings. Three are hearts, so \(P(\text{heart}\mid\text{face})=3/12=1/4\).'],
['Conditional probability','If \(P(B)=0.40\) and \(P(A\mid B)=0.25\), what is \(P(A\cap B)\)?',['0.10','0.16','0.40','0.65'],[0],'Rearrange the conditional formula: \(P(A\cap B)=P(A\mid B)P(B)=0.25\times0.40=0.10\).'],
['Independence','If events \(A\) and \(B\) are independent and \(P(A)=0.70\), what is \(P(A\mid B)\), assuming \(P(B)>0\)?',['0','0.30','0.50','0.70'],[3],'Independence means knowing \(B\) occurred does not change the probability of \(A\): \(P(A\mid B)=P(A)=0.70\).'],
['Select all that apply','Which event pairs are disjoint?',['Rolling one die: “even” and “greater than 3”','One card: “heart” and “club”','One coin toss: “heads” and “tails”','Rolling one die: “odd” and “less than 4”'],[1,2],'Disjoint events cannot occur on the same trial. A card cannot be both a heart and a club, and one coin toss cannot be both heads and tails. The other pairs overlap.'],
['Sequential experiments','A fair coin is tossed three times. What is the probability of the exact sequence HTH?',['\(1/3\)','\(1/4\)','\(1/8\)','\(3/8\)'],[2],'Each specific three-toss sequence has probability \(\frac12\cdot\frac12\cdot\frac12=\frac18\).'],
['Continuous sample spaces','A number is selected uniformly at random from the interval \([0,1]\). What is the probability that it is exactly \(0.5\)?',['0','0.5','1','Cannot be determined'],[0],'For a continuous sample space, one exact point has probability zero. Probabilities come from intervals or regions with nonzero width.'],
['Model building','A measured relative frequency of packet loss approaches 0.02 after a very large number of transmissions. What does a probability model use 0.02 to represent?',['The exact result of the next transmission','The long-run probability of packet loss under those conditions','The number of packet losses in every future trial','A guarantee that no packet will be lost'],[1],'Chapter 1’s statistical regularity connects long-run relative frequency to probability. The next transmission remains uncertain.']
];
let i=0,score=0,topics={};const $=id=>document.getElementById(id);
function draw(){let q=qs[i],multi=q[3].length>1;$('meta').textContent=`Question ${i+1} of ${qs.length}`;$('bar').value=i;$('topic').textContent=q[0]+(multi?' · Select all that apply':'');$('prompt').textContent=q[1];$('choices').innerHTML=q[2].map((x,n)=>`<label class="choice"><input type="${multi?'checkbox':'radio'}" name="answer" value="${n}"><span>${String.fromCharCode(65+n)}. ${x}</span></label>`).join('');$('feedback').hidden=true;$('warning').hidden=true;$('submit').hidden=false;$('next').hidden=true}
$('form').onsubmit=e=>{e.preventDefault();let q=qs[i],picked=[...document.querySelectorAll('input:checked')].map(x=>+x.value).sort((a,b)=>a-b);if(!picked.length){$('warning').textContent='Select at least one answer before submitting.';$('warning').hidden=false;return}let ok=picked.length===q[3].length&&picked.every((x,n)=>x===q[3][n]);topics[q[0]]??={correct:0,total:0};topics[q[0]].total++;if(ok){score++;topics[q[0]].correct++}document.querySelectorAll('input').forEach(x=>x.disabled=true);$('feedback').innerHTML=`<hr><p class="${ok?'correct':'wrong'}"><strong>${ok?'Correct.':'Not quite.'}</strong></p><p>${q[4]}</p>`;if(window.renderMathInElement)renderMathInElement($('feedback'),{delimiters:[{left:'\\(',right:'\\)',display:false}],throwOnError:false});$('feedback').hidden=false;$('submit').hidden=true;$('next').hidden=false};
$('next').onclick=()=>{i++;if(i<qs.length)draw();else{$('quiz').hidden=true;$('done').hidden=false;$('bar').value=qs.length;$('meta').textContent='Quiz complete';$('score').textContent=`You answered ${score} of ${qs.length} correctly.`;let weak=Object.entries(topics).filter(([,v])=>v.correct<v.total).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total));$('focus').innerHTML=weak.length?`<h3>Focus your review</h3><ul>${weak.map(([n,v])=>`<li><strong>${n}</strong>: ${v.correct} of ${v.total} correct</li>`).join('')}</ul><p>Review the explanations for those questions, then retake the quiz.</p>`:`<h3>Strong result</h3><p>You answered every question correctly. Explain each result aloud to reinforce it.</p>`}};$('restart').onclick=()=>{i=0;score=0;topics={};$('done').hidden=true;$('quiz').hidden=false;draw()};draw();
</script></body></html>
